product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

  # Koin DI
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel

  # Room & SQLite
  - $libs.androidx.room.runtime
  - $libs.androidx.sqlite.bundled

dependencies@android:
  - $compose.uiTooling
  - $libs.koin.android

test-dependencies:
  - $kotlin.test
  - $libs.kotlinx.coroutines.test

settings:
  compose:
    enabled: true
    resources:
      packageName: com.jjcr11.rss.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    ksp:
      processors:
        - $libs.androidx.room.compiler
