product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

plugins:
  build-config: enabled

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.navigation.compose

  # Date / Time
  - $libs.kotlinx.datetime

  # Serialization
  - $kotlin.serialization.json

  # Supabase
  - $libs.supabase.postgrest
  - $libs.supabase.realtime
  - $libs.supabase.auth

  # Koin DI
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel

  # Room & SQLite
  - $libs.androidx.room.runtime
  - $libs.androidx.sqlite.bundled

  # DataStore (Key-Value Preferences)
  - $libs.androidx.datastore.preferences

  # Ktor Client
  - $libs.ktor.client.core

  # Ksoup (XML Parser)
  - $libs.ksoup

  # Logging
  - $libs.touchlab.kermit

  # Coil (Image Loading)
  - $libs.coil.compose
  - $libs.coil.network.ktor3

dependencies@jvm:
  - $libs.ktor.client.cio

dependencies@android:
  - $compose.uiTooling
  - $libs.koin.android
  - $libs.ktor.client.okhttp

dependencies@ios:
  - $libs.ktor.client.darwin

test-dependencies:
  - $kotlin.test
  - $libs.kotlinx.coroutines.test
  - $libs.ktor.client.mock

test-dependencies@jvm:
  - $libs.kotlinx.coroutines.test

test-dependencies@android:
  - $libs.kotlinx.coroutines.test

settings:
  compose:
    enabled: true
    resources:
      packageName: com.jjcr11.rss.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization: enabled
    freeCompilerArgs:
      - -Xexpect-actual-classes
    ksp:
      processors:
        - $libs.androidx.room.compiler
