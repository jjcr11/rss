name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract version from tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> local.properties

      - name: Make kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: Build Android APK
        run: ./kotlin build -m androidApp

      - name: Find and Copy APK
        run: |
          mkdir -p artifacts
          find build/ -name "*.apk" -exec cp {} artifacts/rss-app.apk \;

      - name: Package Desktop Executable JAR
        run: ./kotlin package -m desktopApp -f executable-jar

      - name: Package Linux .deb using jpackage
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot
          jpackage \
            --input build/tasks/_desktopApp_executableJarJvm \
            --name "rss-app" \
            --app-version "${{ env.APP_VERSION }}" \
            --main-jar desktopApp-jvm-executable.jar \
            --type deb \
            --linux-shortcut \
            --dest artifacts

      - name: Upload Linux & Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-packages
          path: artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract version from tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create local.properties
        shell: bash
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> local.properties

      - name: Package Desktop Executable JAR
        run: ./kotlin.bat package -m desktopApp -f executable-jar

      - name: Package Windows .exe using jpackage
        shell: bash
        run: |
          mkdir -p artifacts
          jpackage \
            --input build/tasks/_desktopApp_executableJarJvm \
            --name "RssApp" \
            --app-version "${{ env.APP_VERSION }}" \
            --main-jar desktopApp-jvm-executable.jar \
            --type exe \
            --win-shortcut \
            --win-menu \
            --dest artifacts

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: artifacts/*

  # ==========================================================
  # Publish Artifacts to GitHub Release
  # ==========================================================
  publish-release:
    needs: [build-linux-and-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Display binaries to release
        run: ls -la release-binaries

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
